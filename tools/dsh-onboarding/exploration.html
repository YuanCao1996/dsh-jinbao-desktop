<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>金宝 · 探索</title><style>
:root{color-scheme:light;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#29322f;background:#f4f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:36px 28px}h1{font-size:32px;margin:0}p{color:#748078;line-height:1.7}.hero{padding:30px;border-radius:24px;background:linear-gradient(120deg,#fff9ed,#edf4ef);border:1px solid #e9eee6}.eyebrow{color:#b37a38;font-size:12px;letter-spacing:.15em}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}button,select{font:inherit;border:1px solid #dce5dc;border-radius:12px;background:#fff;padding:10px 16px;color:#344039;cursor:pointer}button:hover{border-color:#d5a264;background:#fff8ed}button:focus-visible,select:focus-visible{outline:3px solid #dba85a}button:disabled{opacity:.5;cursor:wait}.selected{background:#f9e8d0;border-color:#e3b170}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.card{min-height:98px;text-align:left;background:#fff;border:1px solid #e5ebe3;border-radius:18px;padding:15px;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-3px)}.card img{width:48px;height:48px;object-fit:cover;border-radius:12px;display:block;margin-bottom:10px;background:#f0f2ed}.card span{display:block;margin-top:12px;color:#9ba69c;font-size:12px}.card[data-done=true]{border-color:#e5b675;background:#fffbf4}.card[data-done=true] span{color:#a76e2f}.panel{margin-top:24px;background:#fff;border:1px solid #e6ece4;border-radius:20px;padding:22px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{min-height:26px}ol{padding-left:22px}li{padding:4px}small{color:#77847a}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(max-width:600px){main{padding:18px}.hero{padding:22px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><main><a id="back" href="/" style="display:inline-block;margin:0 0 18px;color:#876036;text-decoration:none">← 返回设置</a><header class="hero"><span class="eyebrow">JINBAO · EXPLORATION</span><h1>探索未至之境</h1><p>每一次新的尝试，都值得被记录。只有实际体验过的内容才计入探索足迹。</p><small id="summary">正在读取图鉴…</small></header><div class="controls"><select id="game" aria-label="选择游戏"><option value="lol_pc">英雄联盟 · 电脑</option><option value="wzry">王者荣耀</option><option value="jinchanchan">金铲铲之战</option></select><select id="season" aria-label="选择赛季" hidden><option>S18</option><option>S17</option><option>S16</option><option>S11</option><option>S8</option><option>S4.5</option><option>S100024</option></select><select id="category" aria-label="选择分类"></select><input id="search" type="search" placeholder="搜索名称" aria-label="搜索图鉴" style="font:inherit;border:1px solid #dce5dc;border-radius:12px;padding:10px 14px;min-width:170px"><select id="filter" aria-label="筛选探索状态"><option value="all">全部状态</option><option value="done">已探索</option><option value="todo">待探索</option></select><button id="refresh">刷新图鉴</button><button id="suggestion" hidden></button></div><small>部分图标按需从腾讯资源服务器加载，对方可获取你的网络地址；加载失败时仅显示文字。</small><p id="status" class="status" role="status" aria-live="polite"></p><div id="grid" class="grid"></div><section class="panel"><h2>探索榜</h2><p>按游戏、赛季和分类统计。排名基于玩家提交的探索足迹，不代表官方战绩。</p><p id="rankState"></p><ol id="ranking"></ol><div class="actions"><button id="join">参与探索榜</button><button id="sync">同步本机足迹</button><button id="leave">退出榜单</button><button id="review" hidden>检查同步差异</button></div><small>参与后其他玩家可看到你的昵称、探索数量和排名；不上传截图或完整对局记录。</small></section></main><script>
const nonce=location.hash.slice(1);history.replaceState(null,'',location.pathname);document.getElementById('back').href='/#'+nonce;const $=id=>document.getElementById(id);let view=null,busy=false,reloadRequested=false;
async function api(data){const q=new URLSearchParams({game:$('game').value,season:$('game').value==='jinchanchan'?$('season').value:'',category:$('category').value});const r=await fetch('/api/exploration'+(data?'':'?'+q),{method:data?'POST':'GET',headers:{'X-Jinbao-Setup':nonce,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await r.json();if(!r.ok)throw Error(result.error||'暂时无法连接探索服务');return result}
function categories(){const game=$('game').value;$('season').hidden=game!=='jinchanchan';$('category').replaceChildren();for(const name of game==='jinchanchan'?($('season').value==='S18'?['阵容','弈子','羁绊','模式']:['阵容','弈子','羁绊']):['英雄','模式']){const option=document.createElement('option');option.value=option.textContent=name;$('category').append(option)}}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){$('status').textContent=e.message;$('review').hidden=!/差异|变化/.test(e.message)}finally{busy=false;if(reloadRequested){reloadRequested=false;queueMicrotask(refresh)}}}
async function refresh(){if(busy){reloadRequested=true;return}await run(async()=>{$('status').textContent='正在读取探索足迹…';const game=$('game').value,season=game==='jinchanchan'?$('season').value:'',category=$('category').value;const data=await api();if(game!==$('game').value||season!==($('game').value==='jinchanchan'?$('season').value:'')||category!==$('category').value)return;view=data;const selected=new Set(data.selected);$('summary').textContent=`当前图鉴 ${selected.size} 项已探索 · ${data.names.length} 项已收录${data.catalogComplete?"":" · 资料尚不完整"}`;$('status').textContent=data.pending?`本机有 ${data.pending} 项待同步操作`:(data.catalogComplete?'点击条目，确认是否实际体验过':'该赛季资料尚不完整，仅展示已收录内容');$('grid').replaceChildren();for(const name of data.names){const done=selected.has(name),card=document.createElement('button'),label=document.createElement('strong'),hint=document.createElement('span');card.className='card';card.dataset.done=done;card.dataset.name=name.toLowerCase();label.textContent=name;hint.textContent=done?'✓ 已探索':'尚未探索';const icon=data.icons?.[name];if(typeof icon==="string"&&icon.startsWith("https://game.gtimg.cn/")){const img=document.createElement("img");img.loading="lazy";img.alt="";img.onerror=()=>img.remove();img.src=icon;card.append(img)}card.append(label,hint);card.onclick=()=>run(async()=>{if(!confirm(done?`确认撤销「${name}」的探索记录？`:`你是否已经实际体验过「${name}」？仅查看或收到推荐不计入。`))return;await api({action:'mark',game,season,category,entity:name,explored:!done});busy=false;await refresh()});$('grid').append(card)}$('rankState').textContent=data.participating?'你已参与探索榜':'你尚未参与探索榜';$('join').hidden=data.participating;$('sync').hidden=$('leave').hidden=!data.participating;$('ranking').replaceChildren();for(const row of data.board.entries||[]){const li=document.createElement('li');li.textContent=`第 ${row.rank} 名 · ${row.name} · ${row.count} 项${row.is_me?'（我）':''}`;$('ranking').append(li)}applyFilter();loadSuggestion(game,season,category,selected,data.names,data.aliases)})}
$('join').onclick=()=>run(async()=>{if(!confirm('参与后，其他玩家可看到你的昵称、探索数量和排名。是否同意参与？'))return;await api({action:'participation',enabled:true});busy=false;await refresh()});$('leave').onclick=()=>run(async()=>{if(!confirm('退出后不再公开排名，也不再同步。已上传资料保留至账号注销。确认退出？'))return;await api({action:'participation',enabled:false});busy=false;await refresh()});$('sync').onclick=()=>run(async()=>{await api({action:'sync'});busy=false;await refresh()});$('review').onclick=()=>run(async()=>{const c=await api({action:'conflict'});if(!confirm(`${c.entity}\n云端：${c.remote?'已探索':'未探索'}\n本机待处理：${c.operation==='add'?'标记已探索':'撤销记录'}\n\n按本机操作继续？`))return;await api({action:'resolve',operationId:c.operationId,revision:c.revision});$('review').hidden=true;await api({action:'sync'});busy=false;await refresh()});async function loadSuggestion(game,season,category,selected,names,aliases){const button=$('suggestion');button.hidden=true;try{const r=await fetch('/api/exploration/suggestion',{headers:{'X-Jinbao-Setup':nonce}}),data=await r.json(),s=category==='模式'?data.modeSuggestion:data.suggestion;if(!r.ok||!s||s.game!==game||s.season!==season||s.category!==category||game!==$('game').value||category!==$('category').value)return;const name=names.includes(s.entity)?s.entity:aliases?.[s.alias];if(!name||!names.includes(name)||selected.has(name))return;button.textContent='本局待确认：'+name;button.hidden=false;button.onclick=()=>run(async()=>{const latest=await fetch('/api/exploration/suggestion',{headers:{'X-Jinbao-Setup':nonce}}),result=await latest.json(),current=category==='模式'?result.modeSuggestion:result.suggestion;if(!latest.ok||!current||current.entity!==s.entity||current.alias!==s.alias||current.game!==s.game||!s.matchKey||current.matchKey!==s.matchKey){button.hidden=true;$('status').textContent='本局识别状态已变化，请重新查看';return}if(!confirm('识别到本局可能使用了「'+name+'」。确认是你本人实际体验后才计入探索。'))return;await api({action:'markSuggestion',game,season,category,entity:name,matchKey:s.matchKey,observedEntity:s.entity,alias:s.alias});busy=false;await refresh()})}catch{button.hidden=true}}function applyFilter(){const text=$('search').value.trim().toLowerCase(),filter=$('filter').value;for(const card of $('grid').children){const matches=card.dataset.name.includes(text)&&(filter==='all'||(filter==='done')===(card.dataset.done==='true'));card.hidden=!matches}}$('search').oninput=applyFilter;$('filter').onchange=applyFilter;$('game').onchange=()=>{categories();refresh()};$('season').onchange=()=>{const selected=$('category').value;categories();if([...$('category').options].some(option=>option.value===selected))$('category').value=selected;refresh()};$('category').onchange=$('refresh').onclick=refresh;categories();refresh();
</script></body></html>
