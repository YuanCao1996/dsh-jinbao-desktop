<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金宝 · 新手引导</title>
<style>
:root{
  --bg:#0d1117; --panel:#151a20; --panel-2:#172033; --line:#25313d;
  --ink:#e2e8f0; --muted:#94a3b8; --accent:#cba86c; --accent-soft:#e7be79;
  --ok:#5fbf7f;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(1200px 600px at 50% -10%,#1a2433 0%,var(--bg) 60%);color:var(--ink);
  font-family:"Segoe UI","Microsoft YaHei UI",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 22px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.brand{font-size:15px;font-weight:600;letter-spacing:.02em}
.brand em{color:var(--accent);font-style:normal}
.spacer{flex:1}
.skip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  padding:7px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.2s}
.skip:hover{color:var(--ink);border-color:var(--accent)}
.progress{display:flex;gap:6px;margin-bottom:22px}
.seg{height:3px;flex:1;border-radius:3px;background:var(--line);overflow:hidden;position:relative}
.seg i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-soft));transition:width .45s ease}
.seg.done i{width:100%}
.seg.current i{width:100%;opacity:.55}
.counter{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:6px}
.counter b{color:var(--accent-soft);font-weight:600}
.stage{position:relative;min-height:300px}
.step{display:none}
.step.is-active{display:block;animation:stepIn .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes stepIn{from{opacity:0;transform:translateY(14px) scale(.995)}to{opacity:1;transform:none}}
.card{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.card{grid-template-columns:1fr}}
.shot{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0b1016;
  box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 1px rgba(203,168,108,.08) inset;position:relative}
.shot::after{content:"";position:absolute;inset:0;border-radius:14px;
  background:linear-gradient(160deg,rgba(203,168,108,.10),transparent 42%);pointer-events:none}
.shot img{display:block;width:100%;height:auto;animation:kenburns 14s ease-out both}
.step.is-active .shot img{animation-play-state:running}
@keyframes kenburns{from{transform:scale(1.015)}to{transform:scale(1.075)}}
.copy h2{margin:2px 0 10px;font-size:22px;line-height:1.35;letter-spacing:.01em}
.copy p{margin:0 0 12px;color:#c7d2df;font-size:14px;line-height:1.72}
.note{margin:14px 0 0;padding:10px 12px;border-left:2px solid var(--accent);border-radius:0 8px 8px 0;
  background:rgba(203,168,108,.07);color:var(--muted);font-size:12.5px;line-height:1.6}
.badge{display:inline-block;font-size:11.5px;letter-spacing:.12em;color:#151a20;background:linear-gradient(120deg,var(--accent),var(--accent-soft));
  padding:4px 10px;border-radius:999px;font-weight:700;margin-bottom:12px}
.hero{text-align:center;padding:34px 10px 8px}
.hero h1{font-size:30px;margin:0 0 14px;letter-spacing:.01em}
.hero p{max-width:560px;margin:0 auto 6px;color:#c7d2df;font-size:14.5px;line-height:1.8}
.hero .note{display:inline-block;text-align:left;margin-top:20px;border-left:0;border:1px solid var(--line);border-radius:10px}
.foot{display:flex;align-items:center;gap:12px;margin-top:26px}
.foot .spacer{flex:1}
button.primary,button.ghost{appearance:none;cursor:pointer;font-size:14px;padding:11px 22px;border-radius:11px;
  transition:transform .16s ease,background .2s,border-color .2s,opacity .2s}
button.primary{border:0;color:#151a20;font-weight:700;background:linear-gradient(120deg,var(--accent),var(--accent-soft));
  box-shadow:0 10px 26px rgba(203,168,108,.22)}
button.primary:hover{transform:translateY(-1px)}
button.primary:disabled,button.ghost:disabled{opacity:.35;cursor:default;transform:none}
button.ghost{border:1px solid var(--line);background:transparent;color:var(--ink)}
button.ghost:hover:not(:disabled){border-color:var(--accent)}
.hint{font-size:12px;color:#6f7f90}
.done{text-align:center;padding:40px 10px}
.done .tick{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,rgba(95,191,127,.32),rgba(95,191,127,.06));border:1px solid rgba(95,191,127,.5);
  animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
.done .tick svg{width:30px;height:30px;stroke:var(--ok);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){
  .step.is-active,.shot img,.done .tick{animation:none}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">金宝 · <em>新手引导</em></div>
    <div class="spacer"></div>
    <button class="skip" id="skip" type="button">跳过</button>
  </div>

  <div class="progress" id="progress"></div>
  <div class="counter" id="counter"></div>

  <div class="stage" id="stage"></div>

  <div class="foot">
    <button class="ghost" id="prev" type="button">上一步</button>
    <span class="hint">← → 切换，Esc 关闭</span>
    <div class="spacer"></div>
    <button class="primary" id="next" type="button">下一步</button>
  </div>
</div>

<script>
const STEPS = [
  {kind:'welcome', badge:'内测专属',
   title:'欢迎来到金宝',
   description:'金宝读取你本机的游戏日志，在桌面悬浮窗里给出对局建议，聊天、检索和会话交给 DSH 原生智能体。',
   note:'接下来用 3 张真实界面截图，带你熟悉每个页面。引导随时可以在设置页重新打开，不会修改你的助手设置。'},
  {image:'advice.png', name:'战况', title:'战况：建议、事件与聊天都在这页',
   description:'大框的「战况」页显示最新一条策略建议，随对局形势不断替换；顶部同时显示英雄、等级、KDA 和金币。关键节点时间线（装备、海克斯、防御塔、团灭）和聊天入口也在这里。',
   note:'开局加载会给出六件完整出装顺序，每次阵亡会提醒下一次该补什么；建议只来自本局日志与检索资料，未知信息会明确说明。'},
  {image:'augments.png', name:'海克斯', title:'海克斯：三选一识别与推荐',
   description:'三选一面板出现时自动读取三张卡，按当前英雄的资料排名排序；判不准时会弹确认让你选，选中后「本局已选」立刻更新。',
   note:'识别不到就保持待确认，不会把猜测当成已经拥有；英雄 Top10 与推荐组合常驻显示。'},
  {image:'players.png', name:'胜率', title:'胜率：双方样本数据',
   description:'显示敌我双方英雄的大乱斗样本胜率与强度档位；人数齐全时给出按强度加权的团队估算。',
   note:'这是启发式样本指标，不是本局获胜概率，双方不要求合计 100%。'},
  {image:'settings.png', name:'设置', title:'设置页：账号、模型与展示',
   description:'网页版设置管理账号与额度、模型服务、游戏与观察、手机连接、角色与语音、记忆与展示、更新与诊断。战况页顶部那行“智能体动态”就在「记忆与展示」里开关。',
   note:'新手引导随时可以在这里重新打开；登录与额度、更新与诊断也都在这页。'},
  {image:'collapsed.png', name:'收起', title:'收起与展开：变成右下角的小球',
   description:'点标题栏右侧的“—”或按 Ctrl+Alt+↑ 收起成右下角的小球，点小球或再按一次快捷键展开。收起后不会再挡视野，采集和教练照常在后台跑；有新建议时小球上会显示未读数字。',
   note:'小球可以拖动位置；Ctrl+Alt+←/→ 切换页面，Ctrl+Alt+↓ 展开。'}
];

const stage = document.getElementById('stage');
const progress = document.getElementById('progress');
const counter = document.getElementById('counter');
const prev = document.getElementById('prev');
const next = document.getElementById('next');
const skip = document.getElementById('skip');
let index = 0;

progress.innerHTML = STEPS.map(() => '<span class="seg"><i></i></span>').join('');

function esc(value){return String(value).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

stage.innerHTML = STEPS.map((step, i) => {
  const body = step.kind === 'welcome'
    ? `<div class="hero"><span class="badge">${esc(step.badge)}</span>
         <h1>${esc(step.title)}</h1>
         <p>${esc(step.description)}</p>
         <div class="note">${esc(step.note)}</div></div>`
    : `<div class="card">
         <div class="shot"><img src="/welcome/${esc(step.image)}" alt="${esc(step.name)}页截图" loading="${i < 2 ? 'eager' : 'lazy'}"></div>
         <div class="copy"><h2>${esc(step.title)}</h2><p>${esc(step.description)}</p>
           <div class="note">${esc(step.note)}</div></div>
       </div>`;
  return `<section class="step" data-step="${i}">${body}</section>`;
}).join('');

const sections = [...stage.querySelectorAll('.step')];
const segments = [...progress.querySelectorAll('.seg')];
const LABELS = STEPS.map(step => step.name || '欢迎');

function render(){
  sections.forEach((section, i) => section.classList.toggle('is-active', i === index));
  segments.forEach((seg, i) => {
    seg.className = 'seg' + (i < index ? ' done' : i === index ? ' current' : '');
  });
  counter.innerHTML = `<b>${String(index + 1).padStart(2,'0')} / ${String(STEPS.length).padStart(2,'0')}</b> · ${esc(LABELS[index])}`;
  prev.disabled = index === 0;
  const last = index === STEPS.length - 1;
  next.textContent = last ? '开始使用' : '下一步';
  if (last) { next.onclick = finish; } else { next.onclick = () => go(index + 1); }
}

function go(target){
  if (!window.__welcomeSeenReported) reportSeen();
  index = Math.max(0, Math.min(STEPS.length - 1, target));
  render();
}

function reportSeen(){
  window.__welcomeSeenReported = true;
  try{
    const nonce = location.hash.replace(/^#/, '');
    fetch('/api/welcome/seen', {method:'POST', headers:{'Content-Type':'application/json', ...(nonce ? {'X-Jinbao-Setup':nonce} : {})}, body:'{}'}).catch(() => {});
  }catch(_){}
}

function finish(){
  reportSeen();
  stage.innerHTML = `<div class="done">
      <div class="tick"><svg viewBox="0 0 24 24"><path d="M4 12.5 9.5 18 20 7"/></svg></div>
      <h2 style="margin:0 0 10px">准备好了</h2>
      <p style="color:#c7d2df;margin:0 0 6px">进入游戏后悬浮窗会自动出现；忘记操作可以在设置页重新打开本引导。</p>
    </div>`;
  prev.disabled = true; next.disabled = true; skip.hidden = true;
  progress.querySelectorAll('.seg').forEach(seg => seg.className = 'seg done');
}

prev.onclick = () => go(index - 1);
skip.onclick = () => go(STEPS.length - 1);
addEventListener('keydown', event => {
  if (event.key === 'ArrowRight') { event.preventDefault(); if (index < STEPS.length - 1) go(index + 1); }
  else if (event.key === 'ArrowLeft') { event.preventDefault(); go(index - 1); }
  else if (event.key === 'Escape') window.close();
});

render();
</script>
</body>
</html>
